# Layer order matters:
#   memory     → storage, recall tools, per-step injection block
#   tools      → controlled hands (guard + approval + policy check, + kb_store)
#   scaffold   → injects one discipline line per turn; never routes, never picks tools
#   governance → observes everything, injects nothing
#   panel      → read-only sidebar view; no model surface at all
#
# Each row is an independent patch line: disable one layer by deleting its row
# (or setting `disabled: true`) without touching the others. `config` is applied
# as a whole — the loader does not deep-merge with a later profile layer, so a
# profile that re-declares a row must restate every field it wants.
#
# ── WARNING ──────────────────────────────────────────────────────────────────
# Every `workspaceRoot: .` below is resolved against the HOST PROCESS cwd, which
# is usually not your project directory and may not even be writable. Override
# each one with an absolute path in your profile's cordis.patch.yml. This defect
# has shipped twice in this project (memory, then governance); see
# docs/spec-compliance.md §3.
#
# ── 知识库位置 ────────────────────────────────────────────────────────────────
# `storeRoot: .pseudo-agi` is only a DEFAULT. The live root is whatever
# `<workspaceRoot>/.pseudo-agi/store.json` points at, and all five rows follow
# that one file. To move the knowledge base, ask the agent to run
# `kb_store({ action: "relocate", to: "D:/AGI-KB/pseudo-agi" })` — do not edit
# five configs by hand. See docs/install.md §6.
# ─────────────────────────────────────────────────────────────────────────────

# ── 为什么 name 是包内子路径 ──────────────────────────────────────────────────
# 形状是 `@pseudo-agi/bundle/layers/<layer>`，不是 `@pseudo-agi/<layer>`：插件 patch
# 里的 name 是一个模块说明符，loader 用 `import.meta.resolve` 从**profile 的 package
# scope** 解析它。自包含安装时 profile 只有 `@pseudo-agi/bundle` 一个目录，六个层包
# 在它自己的 node_modules 里；子路径从 profile 解析得到 bundle，转发文件再从 bundle
# 目录解析到内置副本。link 安装（开发）同样可用，因为那时兄弟包在 workspace 里。
# 详见 packages/pseudo-agi-bundle/layers/README.md。
# ─────────────────────────────────────────────────────────────────────────────

- insert:
    - id: pseudo-agi-memory
      name: '@pseudo-agi/bundle/layers/memory'
      config:
        workspaceRoot: .
        storeRoot: .pseudo-agi
        root: .pseudo-agi/memory
        maxInjectTokens: 900
        minCoverage: 0.34
        minConfidenceToInject: 0.5
        verifyFileEvidence: true
        writeWorkingDigest: true

    - id: pseudo-agi-tools
      name: '@pseudo-agi/bundle/layers/tools'
      config:
        workspaceRoot: .
        storeRoot: .pseudo-agi
        knowledgeRoots:
          - docs
          - .pseudo-agi/memory
        writeRoots:
          - .
        # The consciousness is the model: writes do not ask a human. The boundary
        # is the guard plus the host's own file policy (read-only refuses here).
        writeRequiresApproval: false
        maxWriteBytes: 262144

    # Formerly `@pseudo-agi/controller`. The keyword router is gone: "what to do
    # next" is the model's call, so this layer only injects discipline.
    - id: pseudo-agi-scaffold
      name: '@pseudo-agi/bundle/layers/scaffold'
      config:
        enabled: true
        injectPerTurn: 1
        requireEvidence: true

    - id: pseudo-agi-governance
      name: '@pseudo-agi/bundle/layers/governance'
      config:
        workspaceRoot: .
        storeRoot: .pseudo-agi
        root: .pseudo-agi/governance
        journal: true
        maxSessions: 64
        maxRecentLines: 40

    - id: pseudo-agi-panel
      name: '@pseudo-agi/bundle/layers/panel'
      config:
        workspaceRoot: .
        storeRoot: .pseudo-agi
